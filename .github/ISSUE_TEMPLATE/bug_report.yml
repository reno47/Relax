name: Bug report
description: Something isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug — the more detail, the faster it can be fixed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Which area?
      options:
        - TFS
        - GitHub
        - Infra
        - Important Portals
        - Calendar
        - Notes
        - Sign-in / account
        - Other
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Browser / device
      placeholder: e.g. Chrome on Windows 11
    validations:
      required: false
