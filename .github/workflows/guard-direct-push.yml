name: Direct-push guard

# Best-effort alert. Free private repos can't block direct pushes to protected
# branches, so this flags any push to main/staging that doesn't look like it came
# from a pull request by opening a tracking issue. It cannot prevent the push.
on:
  push:
    branches: [main, staging]

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Flag pushes that don't reference a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          REFNAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          case "$MSG" in
            "Merge pull request"*|*"(#"*) echo "Looks like a PR merge — OK."; exit 0 ;;
          esac
          echo "::warning::Possible direct push to $REFNAME by @$ACTOR ($SHA)."
          gh issue create --repo "$REPO" \
            --title "⚠️ Possible direct push to $REFNAME" \
            --body "Commit \`$SHA\` by @$ACTOR landed on \`$REFNAME\` with no pull-request reference in its message. On a free private repo this can't be blocked server-side — please confirm the change went through review." \
            || true
